<!DOCTYPE html>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body { font-family: 'Jua', sans-serif; background-color: #f0fdf4; touch-action: manipulation; }
        .bubble-left { background-color: #ffffff; border-radius: 1rem 1rem 1rem 0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .bubble-right { background-color: #fef08a; border-radius: 1rem 1rem 0 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }

        .chat-container { scroll-behavior: smooth; }

        /* 커스텀 모달 애니메이션 */
        .modal-enter { animation: modalFadeIn 0.3s ease-out forwards; }

</head>
<body class="h-screen w-full overflow-hidden flex justify-center bg-green-50 text-gray-800">

        <!-- 1. 로그인 & 명예의 전당 화면 -->

                <button id="btn-submit" class="bg-green-500 text-white w-14 h-14 rounded-full shadow-[0_3px_0_#16a34a] hover:bg-green-600 active:translate-y-1 active:shadow-none flex items-center justify-center transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                    <i id="btn-submit-icon" class="fa-solid fa-paper-plane text-xl"></i>

        <!-- 4. 방 만들기 대기 모달 -->
        <div id="modal-waiting" class="hidden absolute inset-0 z-40 bg-black/60 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl modal-enter">
                <h3 class="text-2xl font-bold mb-2">방 코드</h3>
                <div id="display-room-code" class="text-5xl font-black text-purple-600 tracking-widest bg-purple-50 py-4 rounded-xl border-2 border-purple-200 mb-4">0000</div>
                <p class="text-gray-600 mb-6">친구에게 이 코드를 알려주세요!<br><span class="text-sm animate-pulse text-blue-500">친구를 기다리는 중...</span></p>
                <button id="btn-cancel-room" class="w-full bg-gray-200 text-gray-700 py-3 rounded-xl font-bold hover:bg-gray-300">취소</button>

        <!-- 5. 방 입장 모달 -->

            <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl modal-enter">
                <h3 class="text-2xl font-bold mb-4">방 들어가기</h3>
                <input type="text" id="input-room-code" maxlength="4" placeholder="4자리 코드 입력" class="w-full text-center text-4xl p-4 font-bold tracking-widest border-2 border-orange-300 rounded-xl mb-6 outline-none focus:border-orange-500 uppercase">
                <div class="flex gap-2">
                    <button id="btn-cancel-join" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-xl font-bold hover:bg-gray-300">취소</button>
                    <button id="btn-join-submit" class="flex-1 bg-orange-500 text-white py-3 rounded-xl font-bold shadow-[0_4px_0_#c2410c] active:translate-y-1 active:shadow-none hover:bg-orange-600">입장하기</button>
                </div>
            </div>

        <!-- 6. 관리자 화면 -->
        <div id="screen-admin" class="hidden-screen flex flex-col h-full bg-gray-100">
            <div class="p-4 bg-gray-800 text-white flex items-center shadow-md">

            </div>
            <div class="p-6 overflow-y-auto flex-1 flex flex-col gap-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-red-600 mb-2"><i class="fa-solid fa-triangle-exclamation mr-1"></i>기록 초기화</h3>
                    <p class="text-sm text-gray-500 mb-4">명예의 전당의 모든 기록을 삭제합니다.</p>
                    <button id="btn-admin-clear-hof" class="w-full bg-red-50 text-red-600 font-bold py-3 rounded-lg border border-red-200 hover:bg-red-100">명예의 전당 초기화</button>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-blue-600 mb-2"><i class="fa-solid fa-key mr-1"></i>비밀번호 변경</h3>
                    <input type="password" id="input-new-admin-pw" placeholder="새 비밀번호 입력" class="w-full p-3 border rounded-lg mb-2 outline-none">
                    <button id="btn-admin-change-pw" class="w-full bg-blue-50 text-blue-600 font-bold py-3 rounded-lg border border-blue-200 hover:bg-blue-100">비밀번호 변경</button>
                </div>

    </div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, doc, onSnapshot, updateDoc, setDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // 사용자 Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyDHCnRrVE2dVuJpf77P-1oftGpczR5WDd4",
            authDomain: "eng-activity.firebaseapp.com",
            projectId: "eng-activity",
            storageBucket: "eng-activity.firebasestorage.app",
            messagingSenderId: "528859753713",
            appId: "1:528859753713:web:a1ed4a054380d181c10d50"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // 익명 로그인 보장
        signInAnonymously(auth).catch((error) => {
            console.error("Firebase Anonymous Login Failed:", error);
        });

        // --- Custom Modal Logic ---
        function showAlert(message, title="알림", icon="🔔") {
            return new Promise((resolve) => {
                const modal = document.getElementById('custom-modal');
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-message').innerHTML = message; // HTML 허용
                document.getElementById('modal-icon').innerText = icon;
                
                const btnConfirm = document.getElementById('modal-btn-confirm');
                const btnCancel = document.getElementById('modal-btn-cancel');
                
                btnCancel.classList.add('hidden');
                modal.classList.remove('hidden');
                
                btnConfirm.onclick = () => {
                    modal.classList.add('hidden');
                    resolve();
                };
            });
        }

        function showConfirm(message, callback, title="확인", icon="❓") {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerHTML = message;
            document.getElementById('modal-icon').innerText = icon;
            
            const btnConfirm = document.getElementById('modal-btn-confirm');
            const btnCancel = document.getElementById('modal-btn-cancel');
            
            btnCancel.classList.remove('hidden');
            modal.classList.remove('hidden');
            
            btnConfirm.onclick = () => {
                modal.classList.add('hidden');
                callback(true);
            };
            btnCancel.onclick = () => {
                modal.classList.add('hidden');
                callback(false);
            };
        }

        // --- State Variables ---
        let userInfo = { grade: '', class: '', num: '', name: '' };
        let formattedName = '';
        let mySessionId = Math.random().toString(36).substring(2, 10); // 고유 세션 ID
        
        let currentScreen = document.getElementById('screen-login');
        let gameScore = 0;
        let timerInterval = null;
        let timeLeft = 60;
        let usedWords = []; // { word: "apple", meaning: "사과" }
        let lastLetter = '';
        
        let currentMode = 'single'; // 'single' or 'multi'
        let currentRoomId = null;
        let roomUnsubscribe = null;
        let isMyTurn = false;
        let hasAnnouncedJoin = false;

        // Dictionaries
        let fastWordSet = new Set(); // 1만개 단어 검증용
        const commonWords = { // Core elementary words for instant response
            'apple': '사과', 'banana': '바나나', 'cat': '고양이', 'dog': '개', 'elephant': '코끼리',
            'fish': '물고기', 'girl': '소녀', 'house': '집', 'ice': '얼음', 'juice': '주스',
            'kite': '연', 'lion': '사자', 'monkey': '원숭이', 'nose': '코', 'orange': '오렌지',
            'pig': '돼지', 'queen': '여왕', 'rabbit': '토끼', 'sun': '태양', 'tree': '나무',
            'umbrella': '우산', 'van': '승합차', 'water': '물', 'xylophone': '실로폰',
            'yellow': '노란색', 'zebra': '얼룩말', 'ant': '개미', 'bear': '곰', 'cow': '소',
            'duck': '오리', 'egg': '계란', 'frog': '개구리', 'goat': '염소', 'horse': '말',
            'ink': '잉크', 'jam': '잼', 'king': '왕', 'lemon': '레몬', 'mouse': '쥐',
            'nut': '견과류', 'owl': '올빼미', 'pen': '펜', 'cup': '컵', 'desk': '책상',
            'road': '길', 'tiger': '호랑이', 'school': '학교', 'book': '책', 'bag': '가방',
            'boy': '소년', 'cap': '모자', 'car': '자동차', 'doll': '인형', 'door': '문'
        };

        // 금기어 목록
        const forbiddenWords = [
            'fuck', 'shit', 'bitch', 'ass', 'sex', 'porn', 'damn', 'crap', 'piss', 
            'dick', 'cock', 'pussy', 'slut', 'whore', 'bastard', 'idiot', 'stupid', 'hell'
        ];

        const screenLogin = document.getElementById('screen-login');
        const screenLobby = document.getElementById('screen-lobby');
        const screenGame = document.getElementById('screen-game');
        const chatContainer = document.getElementById('chat-container');
        const inputWord = document.getElementById('input-word');
        const btnSubmit = document.getElementById('btn-submit');
        const btnSubmitIcon = document.getElementById('btn-submit-icon');

        // --- Init & Load Data ---
        async function loadFastDictionary() {
            try {
                // 약 10,000개 영단어 텍스트 파일(가벼움) 로드
                const response = await fetch('https://raw.githubusercontent.com/first20hours/google-10000-english/master/google-10000-english-no-swears.txt');
                const text = await response.text();
                const words = text.split('\n').map(w => w.trim().toLowerCase()).filter(w => w.length > 0);
                words.forEach(w => fastWordSet.add(w));
                // commonWords도 Set에 추가
                Object.keys(commonWords).forEach(w => fastWordSet.add(w.toLowerCase()));
            } catch (error) {
                console.error("Fast dictionary load failed:", error);
            }
        }
        loadFastDictionary();
        loadHoF();

        // --- UI Flow ---
        function switchScreen(newScreen) {
            currentScreen.classList.add('hidden-screen');
            newScreen.classList.remove('hidden-screen');
            currentScreen = newScreen;
            if(newScreen === screenLogin) loadHoF();
        }

        document.getElementById('btn-login').addEventListener('click', () => {
            const grade = document.getElementById('input-grade').value;
            const cls = document.getElementById('input-class').value;
            const num = document.getElementById('input-num').value;
            const name = document.getElementById('input-name').value.trim();

            if (!grade || !cls || !num || !name) {
                showAlert("학년, 반, 번호, 이름을 모두 입력해주세요!", "알림", "⚠️");
                return;
            }

            userInfo = { grade, class: cls, num, name };
            formattedName = `${grade}학년 ${cls}반 ${num}번 ${name[0]}O${name.length>2 ? name.substring(2) : ''}`;
            
            document.getElementById('display-user-info').innerText = `${name} 학생 환영해요!`;
            switchScreen(screenLobby);
        });

        document.getElementById('btn-back-to-login').addEventListener('click', () => {
            switchScreen(screenLogin);
        });

        // --- Game Logic ---
        async function getTranslation(word) {
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${word}&langpair=en|ko`);
                const data = await res.json();
                if (data && data.responseData && data.responseData.translatedText) {
                    if(data.responseData.translatedText.toLowerCase() === word.toLowerCase()) return null;
                    return data.responseData.translatedText;
                }
            } catch(e) { console.warn("Translation failed"); }
            return null;
        }

        function verifyWordFast(word) {
            word = word.toLowerCase();
            
            // 0. 금기어 검사
            if (forbiddenWords.includes(word)) {
                return { valid: false, reason: "사용할 수 없는 단어입니다!<br>(바른말을 사용해주세요 😇)" };
            }

            // 1. 규칙 검사
            if (usedWords.some(w => w.word === word)) {
                return { valid: false, reason: "이미 사용된 단어입니다." };
            }
            if (lastLetter && word[0] !== lastLetter) {
                return { valid: false, reason: `'${lastLetter.toUpperCase()}'(으)로 시작하는 단어를 입력해야 합니다.` };
            }
            if (word.length < 2) {
                return { valid: false, reason: "단어는 2글자 이상이어야 합니다." };
            }
            if (!/^[a-z]+$/.test(word)) {
                return { valid: false, reason: "알파벳만 입력 가능합니다." };
            }

            // 2. 단어 존재 여부 (Fast 검증)
            if (commonWords[word]) {
                return { valid: true, meaning: commonWords[word], needsAsync: false };
            }
            if (fastWordSet.has(word)) {
                // 일단 통과시키고 백그라운드에서 뜻 찾기 지시
                return { valid: true, meaning: "뜻 검색 중... 🔍", needsAsync: true };
            }

            return { valid: false, reason: "사전에 없는 단어입니다." };
        }

        // 백그라운드에서 뜻을 찾아와 UI를 업데이트하는 함수
        async function updateMeaningInUI(word, msgId) {
            const trans = await getTranslation(word);
            const finalMeaning = trans ? trans : "(알려진 영단어)";
            
            // 상태 업데이트
            const wordObj = usedWords.find(w => w.word === word);
            if(wordObj) wordObj.meaning = finalMeaning;
            
            // UI 업데이트
            const msgEl = document.getElementById(msgId);
            if(msgEl) {
                const meaningEl = msgEl.querySelector('.word-meaning');
                if(meaningEl) {
                    meaningEl.innerText = finalMeaning;
                    meaningEl.classList.remove('text-gray-400', 'animate-pulse');
                    meaningEl.classList.add('text-gray-600');
                }
            }
        }

        function renderChatBubble(sender, word, meaning, msgId = "") {
            const div = document.createElement('div');
            div.className = `flex w-full ${sender === 'me' ? 'justify-end' : 'justify-start'}`;
            if(msgId) div.id = msgId;
            
            const isMe = sender === 'me';
            const bubbleClass = isMe ? 'bubble-right' : 'bubble-left';
            const name = isMe ? '나' : (currentMode === 'single' ? '컴퓨터' : '상대방');
            
            div.innerHTML = `
                <div class="max-w-[70%] flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                    <span class="text-xs text-gray-500 mb-1 px-1">${name}</span>
                    <div class="${bubbleClass} px-5 py-3 relative">
                        <div class="font-bold text-2xl uppercase tracking-widest text-gray-800">${word}</div>
                        <div class="word-meaning text-sm mt-1 text-center font-normal ${meaning.includes('검색 중') ? 'text-gray-400 animate-pulse' : 'text-gray-600'} border-t border-black/10 pt-1">${meaning}</div>
                        ${!isMe && lastLetter ? `<div class="absolute ${isMe ? '-left-2' : '-right-2'} top-4 w-4 h-4 bg-${isMe?'yellow-200':'white'} rotate-45"></div>` : ''}
                    </div>
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        btnSubmit.addEventListener('click', handleUserSubmit);
        inputWord.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleUserSubmit();
        });

        async function handleUserSubmit() {
            if(!isMyTurn) return;
            const word = inputWord.value.trim().toLowerCase();
            if (!word) return;

            const check = verifyWordFast(word);
            if (!check.valid) {
                showAlert(check.reason, "틀렸어요!", "❌");
                inputWord.value = ''; // 금기어든 틀린 단어든 입력창은 비워줌
                return; // 턴 넘기지 않고 다시 입력 기회 부여
            }

            // 정답 처리
            inputWord.value = '';
            isMyTurn = false;
            toggleInput(false);
            
            gameScore += 10;
            document.getElementById('display-score').innerText = `내 점수: ${gameScore}점`;
            
            usedWords.push({ word, meaning: check.meaning });
            lastLetter = word[word.length - 1];
            
            const msgId = `msg-${Date.now()}`;
            renderChatBubble('me', word, check.meaning, msgId);

            if (check.needsAsync) {
                updateMeaningInUI(word, msgId);
            }

            if (currentMode === 'single') {
                resetTimer();
                setTimeout(playComputerTurn, 700);
            } else if (currentMode === 'multi') {
                await updateRoomState(currentRoomId, {
                    lastWord: word,
                    lastMeaning: check.meaning,
                    lastMessageId: msgId,
                    needsAsync: check.needsAsync,
                    turn: 'opponent',
                    lastPlayerId: mySessionId // 내가 쳤음을 식별
                });
                resetTimer();
            }
        }

        // --- 나가기 로직 ---
        document.getElementById('btn-exit').addEventListener('click', () => {
            showConfirm(`게임을 종료하고 로비로 나가시겠습니까?<br>현재까지 획득한 점수(<span class="text-red-500 font-bold">${gameScore}점</span>)가 명예의 전당에 저장됩니다.`, async (confirmed) => {
                if (confirmed) {
                    await saveScoreToHoF();
                    
                    if (currentMode === 'multi') {
                        updateRoomState(currentRoomId, { status: "gameover", winner: "opponent", reason: "상대방 퇴장" });
                    }
                    
                    clearInterval(timerInterval);
                    chatContainer.innerHTML = '';
                    if(roomUnsubscribe) roomUnsubscribe();
                    switchScreen(screenLobby);
                }
            });
        });

        // --- 컴퓨터 로직 ---
        async function playComputerTurn() {
            const availableWords = Object.keys(commonWords).filter(w => w[0] === lastLetter && !usedWords.some(u => u.word === w));
            
            if (availableWords.length === 0) {
                await endGame("컴퓨터가 단어를 찾지 못했습니다! 🎉");
                return;
            }

            const word = availableWords[Math.floor(Math.random() * availableWords.length)];
            const meaning = commonWords[word];
            
            usedWords.push({ word, meaning });
            lastLetter = word[word.length - 1];
            
            renderChatBubble('computer', word, meaning);
            
            isMyTurn = true;
            toggleInput(true);
            resetTimer();
        }

        // --- Common Game Flow ---
        function startGame(mode) {
            currentMode = mode;
            gameScore = 0;
            usedWords = [];
            lastLetter = '';
            chatContainer.innerHTML = '';
            document.getElementById('display-score').innerText = `내 점수: 0점`;
            
            document.getElementById('game-opponent-name').innerHTML = mode === 'single' ? '<i class="fa-solid fa-robot mr-2"></i>컴퓨터' : '<i class="fa-solid fa-user-group mr-2"></i>친구';
            
            switchScreen(screenGame);
            
            if (mode === 'single') {
                isMyTurn = true;
                toggleInput(true);
                renderChatBubble('computer', 'start', '시작 단어입니다.');
                usedWords.push({word: 'start', meaning: '시작'});
                lastLetter = 't';
            } else {
                hasAnnouncedJoin = false;
                toggleInput(isMyTurn);
            }
            resetTimer();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeLeft = 60;
            document.getElementById('display-timer').innerText = timeLeft;
            timerInterval = setInterval(async () => {
                timeLeft--;
                document.getElementById('display-timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    toggleInput(false);
                    if (currentMode === 'single') {
                        await endGame("시간 초과로 패배했습니다. 😥");
                    } else if (currentMode === 'multi') {
                        if (isMyTurn) {
                            await updateRoomState(currentRoomId, { status: "gameover", winner: "opponent", reason: "시간 초과" });
                        }
                    }
                }
            }, 1000);
        }

        function toggleInput(enable) {
            inputWord.disabled = !enable;
            btnSubmit.disabled = !enable;
            if (enable) {
                inputWord.focus();
                inputWord.placeholder = `'${lastLetter.toUpperCase()}'(으)로 시작하는 단어 입력`;
                btnSubmitIcon.className = "fa-solid fa-paper-plane text-xl";
            } else {
                inputWord.placeholder = "상대방 차례입니다...";
                btnSubmitIcon.className = "fa-solid fa-spinner fa-spin text-xl";
            }
        }

        async function endGame(msg) {
            clearInterval(timerInterval);
            await showAlert(msg + `<br><br>최종 점수: <span class="text-green-600 font-bold">${gameScore}점</span>`, "게임 종료", "🏁");
            await saveScoreToHoF();
            if(roomUnsubscribe) roomUnsubscribe();
            switchScreen(screenLobby);
        }

        // --- Multiplayer Logic ---
        document.getElementById('btn-single-mode').addEventListener('click', () => { startGame('single'); });

        document.getElementById('btn-show-create-room').addEventListener('click', async () => {
            const code = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('display-room-code').innerText = code;
            document.getElementById('modal-waiting').classList.remove('hidden');
            
            try {
                await setDoc(doc(db, "rooms", code), {
                    status: "waiting", createdBy: formattedName, createdSession: mySessionId, createdAt: Date.now()
                });
                currentRoomId = code;
                listenToRoom(code, true);
            } catch(e) { showAlert("방 생성 실패!", "오류", "❌"); document.getElementById('modal-waiting').classList.add('hidden');}
        });

        document.getElementById('btn-cancel-room').addEventListener('click', async () => {
            if(currentRoomId) { await deleteDoc(doc(db, "rooms", currentRoomId)); }
            if(roomUnsubscribe) roomUnsubscribe();
            document.getElementById('modal-waiting').classList.add('hidden');
        });

        document.getElementById('btn-show-join-room').addEventListener('click', () => {
            document.getElementById('input-room-code').value = '';
            document.getElementById('modal-join').classList.remove('hidden');
        });

        document.getElementById('btn-cancel-join').addEventListener('click', () => {
            document.getElementById('modal-join').classList.add('hidden');
        });

        document.getElementById('btn-join-submit').addEventListener('click', async () => {
            const code = document.getElementById('input-room-code').value.toUpperCase();
            if(code.length !== 4) return showAlert("4자리 코드를 입력해주세요.", "알림", "⚠️");
            
            try {
                const roomSnap = await getDoc(doc(db, "rooms", code));
                if (roomSnap.exists() && roomSnap.data().status === "waiting") {
                    await updateDoc(doc(db, "rooms", code), {
                        status: "playing",
                        turn: "host",
                        lastWord: "start", lastMeaning: "시작", lastPlayerId: "system",
                        player2Session: mySessionId
                    });
                    document.getElementById('modal-join').classList.add('hidden');
                    currentRoomId = code;
                    listenToRoom(code, false);
                } else {
                    showAlert("방을 찾을 수 없거나 이미 게임이 시작되었습니다.", "알림", "❌");
                }
            } catch(e) { showAlert("입장 실패!", "오류", "❌"); }
        });

        function listenToRoom(roomId, isHost) {
            roomUnsubscribe = onSnapshot(doc(db, "rooms", roomId), async (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();

                if (data.status === "playing") {
                    if (document.getElementById('modal-waiting').classList.contains('hidden') === false) {
                        document.getElementById('modal-waiting').classList.add('hidden');
                        startGame('multi');
                    }
                    
                    if (!hasAnnouncedJoin && !isHost) {
                        startGame('multi');
                        hasAnnouncedJoin = true;
                    }

                    // 단어 동기화 (내가 친 것이 아닐 때만 렌더링)
                    if (data.lastWord && data.lastPlayerId !== mySessionId && data.lastPlayerId !== "system") {
                        if (!usedWords.some(w => w.word === data.lastWord)) {
                            usedWords.push({ word: data.lastWord, meaning: data.lastMeaning });
                            lastLetter = data.lastWord[data.lastWord.length - 1];
                            renderChatBubble('opponent', data.lastWord, data.lastMeaning, data.lastMessageId);
                            
                            // 상대방이 친 단어가 비동기 번역이 필요한 경우 내가 대신 번역해서 보여줌
                            if (data.needsAsync && data.lastMessageId) {
                                updateMeaningInUI(data.lastWord, data.lastMessageId);
                            }
                        }
                    } else if (data.lastWord === "start" && usedWords.length === 0) {
                        usedWords.push({word: 'start', meaning: '시작'});
                        lastLetter = 't';
                        renderChatBubble('computer', 'start', '시작 단어입니다 (방장 먼저 시작)'); // UI상 가운데 렌더링용
                    }

                    // 턴 동기화
                    isMyTurn = (isHost && data.turn === 'host') || (!isHost && data.turn === 'opponent');
                    toggleInput(isMyTurn);
                    
                    // 상대방이 단어를 쳐서 턴이 바뀐 순간 타이머 리셋
                    if (data.lastPlayerId !== mySessionId) resetTimer();
                } 
                else if (data.status === "gameover") {
                    let win = false;
                    if (data.reason === "상대방 퇴장") win = true; // 무조건 남은 사람 승리
                    else win = (isHost && data.winner === 'host') || (!isHost && data.winner === 'opponent');
                    
                    if(win) await endGame(`승리했습니다! 🎉<br>사유: ${data.reason}`);
                    else await endGame(`패배했습니다. 😥<br>사유: ${data.reason}`);
                }
            });
        }

        async function updateRoomState(roomId, updateData) {
            try { await updateDoc(doc(db, "rooms", roomId), updateData); } 
            catch (e) { console.error("Room update failed", e); }
        }

        // --- 명예의 전당 & 관리자 로직 ---
        async function saveScoreToHoF() {
            if (gameScore > 0) {
                try {
                    await addDoc(collection(db, "hallOfFame"), {
                        name: formattedName,
                        score: gameScore,
                        mode: currentMode === 'single' ? '혼자' : '멀티',
                        date: Date.now()
                    });
                } catch (e) { console.error("Score save failed", e); }
            }
        }

        async function loadHoF() {
            const listEl = document.getElementById('hof-list');
            try {
                const q = query(collection(db, "hallOfFame"), orderBy("score", "desc"), limit(20));
                const snapshot = await getDocs(q);
                listEl.innerHTML = '';
                if(snapshot.empty) {
                    listEl.innerHTML = '<div class="text-center text-gray-400 py-4">아직 기록이 없습니다.</div>';
                    return;
                }
                
                let rank = 1;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const isMe = data.name === formattedName;
                    const modeBadge = data.mode === '멀티' 
                        ? '<span class="bg-purple-100 text-purple-600 px-2 py-0.5 rounded text-xs font-bold ml-1 border border-purple-200">멀티</span>'
                        : '<span class="bg-blue-100 text-blue-600 px-2 py-0.5 rounded text-xs font-bold ml-1 border border-blue-200">혼자</span>';
                    
                    const item = document.createElement('div');
                    item.className = `flex justify-between items-center p-3 rounded-lg border ${isMe ? 'bg-yellow-100 border-yellow-300 shadow-sm' : 'bg-white border-gray-100'}`;
                    item.innerHTML = `
                        <div class="flex items-center">
                            <span class="font-bold w-6 text-center ${rank<=3 ? 'text-orange-500' : 'text-gray-400'}">${rank}</span>
                            <span class="ml-2 text-gray-700 font-bold flex items-center">${data.name} ${modeBadge}</span>
                        </div>
                        <span class="font-black text-green-600">${data.score}점</span>
                    `;
                    listEl.appendChild(item);
                    rank++;
                });
            } catch (e) {
                listEl.innerHTML = '<div class="text-center text-red-400 py-4">기록을 불러오지 못했습니다.</div>';
            }
        }

        // 관리자 모드 이벤트
        const screenAdmin = document.getElementById('screen-admin');
        let adminDocId = "admin_settings"; // Admin settings doc
        
        document.getElementById('btn-admin-open').addEventListener('click', () => { switchScreen(screenAdmin); });
        document.getElementById('btn-admin-close').addEventListener('click', () => { switchScreen(screenLogin); });

        document.getElementById('btn-admin-clear-hof').addEventListener('click', () => {
            showConfirm("비밀번호를 입력하세요:", async (pw) => { // 모달로 비번 묻기를 구현하기 복잡하므로 여기선 임시 prompt 사용 혹은 생략
                const realPw = prompt("관리자 비밀번호를 입력하세요.");
                if(!realPw) return;
                
                const snap = await getDoc(doc(db, "admin", adminDocId));
                const correctPw = snap.exists() ? snap.data().pw : "1234";
                
                if (realPw === correctPw) {
                    try {
                        const q = query(collection(db, "hallOfFame"));
                        const snapshot = await getDocs(q);
                        snapshot.forEach(d => deleteDoc(d.ref));
                        showAlert("명예의 전당이 초기화되었습니다.", "성공", "✅");
                    } catch(e) { showAlert("초기화 실패", "오류", "❌"); }
                } else {
                    showAlert("비밀번호가 틀렸습니다.", "실패", "❌");
                }
            }, "초기화 확인", "⚠️");
        });

        document.getElementById('btn-admin-change-pw').addEventListener('click', async () => {
            const currentPw = prompt("현재 비밀번호를 입력하세요.");
            if(!currentPw) return;
            const snap = await getDoc(doc(db, "admin", adminDocId));
            const correctPw = snap.exists() ? snap.data().pw : "1234";
            
            if (currentPw === correctPw) {
                const newPw = document.getElementById('input-new-admin-pw').value;
                if(newPw.length < 4) return showAlert("새 비밀번호는 4자리 이상이어야 합니다.", "알림", "⚠️");
                await setDoc(doc(db, "admin", adminDocId), { pw: newPw }, {merge: true});
                showAlert("비밀번호가 변경되었습니다.", "성공", "✅");
                document.getElementById('input-new-admin-pw').value = '';
            } else {
                showAlert("현재 비밀번호가 틀렸습니다.", "실패", "❌");
            }
        });
    </script>
</body>
</html>
