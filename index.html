<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>초등 영어 끝말잇기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', 'Nunito', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 2px, transparent 2px);
            background-size: 30px 30px;
            overscroll-behavior-y: contain; /* 당겨서 새로고침 방지 */
        }
        .chat-container::-webkit-scrollbar {
            width: 8px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
        /* 로딩 스피너 애니메이션 */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* 말풍선 등장 애니메이션 */
        .pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.8);
        }
        @keyframes popIn { to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center overflow-hidden text-gray-800">

    <!-- 커스텀 모달 (alert/confirm 대체) -->
    <div id="custom-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 px-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full text-center border-4 border-green-400 pop-in">
            <p id="modal-message" class="text-xl mb-6 break-words"></p>
            <div id="modal-buttons" class="flex justify-center space-x-3">
                <!-- 버튼들이 자바스크립트에 의해 동적으로 추가됩니다 -->
            </div>
        </div>
    </div>

    <!-- 전체 랩퍼 -->
    <div id="app-container" class="relative w-full max-w-md h-full sm:h-[90vh] bg-white sm:rounded-3xl shadow-2xl flex flex-col border-0 sm:border-8 border-green-300 overflow-hidden">
        
        <!-- ==================== 화면 1: 로비 화면 ==================== -->
        <div id="screen-lobby" class="flex-1 flex flex-col h-full overflow-y-auto">
            <div class="p-6 pb-2 text-center relative">
                <button id="btn-admin-open" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition">
                    <i class="fa-solid fa-gear text-2xl"></i>
                </button>
                <div class="inline-block bg-yellow-300 rounded-full px-4 py-1 text-sm font-bold text-yellow-800 mb-2 mt-4 shadow-sm">
                    영어 단어 마스터가 되어보자!
                </div>
                <h1 class="text-4xl font-bold text-green-600 drop-shadow-sm mb-1"><i class="fa-solid fa-spell-check"></i> 끝말잇기</h1>
                <p class="text-gray-500 text-sm mb-4">만든이: 곽현석(이의초등학교)</p>

                <!-- 내 정보 입력 -->
                <div class="bg-green-50 rounded-2xl p-4 shadow-inner border border-green-100 mb-4">
                    <h2 class="text-lg text-green-800 mb-3"><i class="fa-solid fa-id-card"></i> 내 정보 입력</h2>
                    <div class="flex space-x-2 mb-2">
                        <select id="input-grade" class="flex-1 p-3 text-lg border-2 border-green-200 rounded-xl focus:outline-none focus:border-green-400 bg-white">
                            <option value="">학년</option>
                            <option value="1">1학년</option><option value="2">2학년</option>
                            <option value="3">3학년</option><option value="4">4학년</option>
                            <option value="5">5학년</option><option value="6">6학년</option>
                        </select>
                        <select id="input-class" class="flex-1 p-3 text-lg border-2 border-green-200 rounded-xl focus:outline-none focus:border-green-400 bg-white">
                            <option value="">반</option>
                            <option value="1">1반</option><option value="2">2반</option>
                            <option value="3">3반</option><option value="4">4반</option>
                            <option value="5">5반</option><option value="6">6반</option>
                            <option value="7">7반</option><option value="8">8반</option>
                            <option value="9">9반</option><option value="10">10반</option>
                        </select>
                    </div>
                    <div class="flex space-x-2">
                        <input type="number" id="input-number" placeholder="번호 (예: 15)" class="flex-1 p-3 text-lg border-2 border-green-200 rounded-xl focus:outline-none focus:border-green-400 text-center" min="1" max="99">
                        <input type="text" id="input-name" placeholder="이름 (예: 홍길동)" class="flex-[2] p-3 text-lg border-2 border-green-200 rounded-xl focus:outline-none focus:border-green-400 text-center">
                    </div>
                </div>

                <!-- 게임 모드 선택 -->
                <div class="flex flex-col space-y-3">
                    <button id="btn-single-play" class="w-full bg-blue-400 hover:bg-blue-500 text-white text-2xl py-4 rounded-2xl shadow-[0_4px_0_#2563eb] active:translate-y-1 active:shadow-none transition flex items-center justify-center">
                        <i class="fa-solid fa-robot mr-3"></i> 혼자 하기
                    </button>
                    <div class="flex space-x-3">
                        <button id="btn-multi-create" class="flex-1 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 text-xl py-3 rounded-2xl shadow-[0_4px_0_#ca8a04] active:translate-y-1 active:shadow-none transition flex items-center justify-center">
                            방 만들기
                        </button>
                        <button id="btn-multi-join" class="flex-1 bg-purple-400 hover:bg-purple-500 text-white text-xl py-3 rounded-2xl shadow-[0_4px_0_#9333ea] active:translate-y-1 active:shadow-none transition flex items-center justify-center">
                            방 들어가기
                        </button>
                    </div>
                </div>
            </div>

            <!-- 명예의 전당 (메인 화면) -->
            <div class="flex-1 flex flex-col bg-orange-50 mt-4 rounded-t-3xl p-6 border-t border-orange-200">
                <h2 class="text-2xl font-bold text-orange-600 text-center mb-4">🏆 명예의 전당 🏆<br><span class="text-sm text-orange-400">(혼자하기 & 멀티방)</span></h2>
                <div id="hof-list" class="flex-1 overflow-y-auto space-y-2">
                    <p class="text-center text-gray-400 mt-4">데이터를 불러오는 중...</p>
                </div>
            </div>
        </div>

        <!-- ==================== 화면 2: 게임 화면 ==================== -->
        <div id="screen-game" class="flex flex-col h-full hidden">
            <!-- 상단 상태바 -->
            <div class="bg-gray-800 text-white p-3 flex justify-between items-center shadow-md z-10">
                <div class="flex flex-col">
                    <span id="game-info" class="font-bold text-lg text-yellow-300"><i class="fa-solid fa-robot"></i> 컴퓨터와 대결</span>
                    <span class="text-xs text-gray-300">내 점수: <span id="display-score" class="text-green-300 font-bold text-lg">0</span> 점</span>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="flex flex-col items-center bg-gray-700 px-3 py-1 rounded-lg border border-gray-600">
                        <span class="text-[10px] text-gray-300">남은 시간</span>
                        <div id="display-timer" class="font-bold text-2xl text-red-400">60</div>
                    </div>
                    <button id="btn-exit" class="bg-red-500 px-3 py-2 rounded-lg text-white hover:bg-red-600 shadow-[0_3px_0_#991b1b] active:translate-y-1 active:shadow-none flex flex-col items-center justify-center transition">
                        <i class="fa-solid fa-door-open text-lg mb-1"></i>
                        <span class="text-[10px] font-bold">나가기</span>
                    </button>
                </div>
            </div>

            <!-- 채팅창 영역 -->
            <div id="chat-container" class="flex-1 p-4 overflow-y-auto bg-[#bacee0] flex flex-col space-y-4 chat-container">
                <!-- 게임 시작 안내 말풍선 (동적 생성) -->
            </div>

            <!-- 입력 영역 -->
            <div class="bg-white p-3 border-t-2 border-gray-200 shadow-[0_-5px_10px_rgba(0,0,0,0.05)] z-10">
                <div class="flex space-x-2">
                    <input type="text" id="word-input" class="flex-1 p-4 text-2xl border-2 border-gray-300 rounded-2xl focus:outline-none focus:border-green-500 font-bold uppercase transition" placeholder="단어 입력..." autocomplete="off">
                    <button id="btn-submit" class="bg-green-500 text-white px-6 py-4 rounded-2xl font-bold text-xl hover:bg-green-600 shadow-[0_4px_0_#166534] active:translate-y-1 active:shadow-none transition flex items-center justify-center min-w-[80px]">
                        <i class="fa-solid fa-paper-plane" id="btn-submit-icon"></i>
                        <span id="btn-submit-spinner" class="spinner hidden"></span>
                    </button>
                </div>
                <p id="feedback-msg" class="text-sm text-red-500 font-bold mt-2 text-center h-4"></p>
            </div>
        </div>

        <!-- ==================== 화면 3: 관리자 화면 ==================== -->
        <div id="screen-admin" class="flex-1 flex flex-col h-full bg-gray-50 hidden overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold text-gray-800"><i class="fa-solid fa-user-shield text-blue-500"></i> 관리자 모드</h2>
                <button id="btn-admin-close" class="text-gray-500 hover:text-gray-800"><i class="fa-solid fa-xmark text-3xl"></i></button>
            </div>
            
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 mb-6">
                <h3 class="font-bold text-gray-700 mb-2">비밀번호 변경</h3>
                <div class="flex space-x-2">
                    <input type="password" id="input-new-pw" placeholder="새 비밀번호" class="flex-1 p-2 border rounded-xl">
                    <button id="btn-change-pw" class="bg-blue-500 text-white px-4 py-2 rounded-xl shadow-sm">변경</button>
                </div>
            </div>

            <h3 class="font-bold text-gray-700 mb-3 text-lg">명예의 전당 기록 관리</h3>
            <div id="admin-hof-list" class="flex-1 overflow-y-auto space-y-3 pb-4">
                <!-- 관리자용 목록이 동적으로 들어갑니다 -->
            </div>
        </div>

    </div>

    <!-- Firebase SDK 및 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 설정
        const defaultAppId = 'word-chain-edu-app';
        const appId = typeof __app_id !== 'undefined' ? __app_id : defaultAppId;
        
        let firebaseConfig;
        if (typeof __firebase_config !== 'undefined') {
            firebaseConfig = JSON.parse(__firebase_config);
        } else {
            // 사용자 제공 프로젝트 설정 (환경 변수가 없을 경우 사용)
            firebaseConfig = {
              apiKey: "AIzaSyDHCnRrVE2dVuJpf77P-1oftGpczR5WDd4",
              authDomain: "eng-activity.firebaseapp.com",
              projectId: "eng-activity",
              storageBucket: "eng-activity.firebasestorage.app",
              messagingSenderId: "528859753713",
              appId: "1:528859753713:web:a1ed4a054380d181c10d50"
            };
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUserId = null;

        // 초등 기본 단어장 (빠른 검색 및 뜻 반환용)
        const builtInDict = {
            'apple': '사과', 'ant': '개미', 'bear': '곰', 'banana': '바나나', 'book': '책', 'cat': '고양이', 'car': '자동차',
            'dog': '개', 'door': '문', 'elephant': '코끼리', 'egg': '달걀', 'frog': '개구리', 'fire': '불', 'goat': '염소',
            'game': '게임', 'hat': '모자', 'house': '집', 'ice': '얼음', 'ink': '잉크', 'juice': '주스', 'king': '왕',
            'lion': '사자', 'lemon': '레몬', 'monkey': '원숭이', 'moon': '달', 'nose': '코', 'nut': '견과류', 'orange': '오렌지',
            'pig': '돼지', 'pencil': '연필', 'queen': '여왕', 'rabbit': '토끼', 'road': '길', 'sun': '태양', 'star': '별',
            'tiger': '호랑이', 'tree': '나무', 'umbrella': '우산', 'van': '승합차', 'water': '물', 'window': '창문',
            'box': '상자', 'yellow': '노란색', 'zoo': '동물원', 'zebra': '얼룩말', 'school': '학교', 'student': '학생',
            'teacher': '선생님', 'friend': '친구', 'boy': '소년', 'girl': '소녀', 'computer': '컴퓨터', 'robot': '로봇'
        };

        // 1만개 단어 리스트 저장용 Set (게임 시작 전 미리 로드됨)
        const fastWordList = new Set(Object.keys(builtInDict));

        // 게임 상태 변수
        let userInfo = { grade: '', classNo: '', number: '', name: '' };
        let currentMode = ''; // 'single' or 'multi'
        let currentRoomId = null;
        let gameScore = 0;
        let usedWords = []; // [{word, meaning}]
        let currentTurnPlayer = ''; 
        let lastLetter = '';
        
        let timerInterval;
        let timeLeft = 60;
        
        let isProcessing = false; // 중복 입력 방지
        let roomUnsubscribe = null;

        // ==================== 커스텀 알림창 로직 ====================
        const modalEl = document.getElementById('custom-modal');
        const modalMsgEl = document.getElementById('modal-message');
        const modalBtnsEl = document.getElementById('modal-buttons');

        function showCustomAlert(msg, onOk = null) {
            modalMsgEl.innerHTML = msg.replace(/\n/g, '<br>');
            modalBtnsEl.innerHTML = '';
            
            const btnOk = document.createElement('button');
            btnOk.className = "bg-green-500 text-white px-6 py-2 rounded-xl font-bold hover:bg-green-600 shadow-[0_3px_0_#166534] active:translate-y-1 active:shadow-none";
            btnOk.innerText = "확인";
            btnOk.onclick = () => {
                modalEl.classList.add('hidden');
                if(onOk) onOk();
            };
            modalBtnsEl.appendChild(btnOk);
            modalEl.classList.remove('hidden');
        }

        function showCustomConfirm(msg, onYes, onNo = null) {
            modalMsgEl.innerHTML = msg.replace(/\n/g, '<br>');
            modalBtnsEl.innerHTML = '';

            const btnNo = document.createElement('button');
            btnNo.className = "bg-gray-400 text-white px-6 py-2 rounded-xl font-bold hover:bg-gray-500 shadow-[0_3px_0_#4b5563] active:translate-y-1 active:shadow-none";
            btnNo.innerText = "취소";
            btnNo.onclick = () => {
                modalEl.classList.add('hidden');
                if(onNo) onNo();
            };
            modalBtnsEl.appendChild(btnNo);

            const btnYes = document.createElement('button');
            btnYes.className = "bg-red-500 text-white px-6 py-2 rounded-xl font-bold hover:bg-red-600 shadow-[0_3px_0_#991b1b] active:translate-y-1 active:shadow-none";
            btnYes.innerText = "확인";
            btnYes.onclick = () => {
                modalEl.classList.add('hidden');
                if(onYes) onYes();
            };
            modalBtnsEl.appendChild(btnYes);
            
            modalEl.classList.remove('hidden');
        }

        function showCustomPrompt(msg, placeholder, onSubmit) {
            modalMsgEl.innerHTML = msg.replace(/\n/g, '<br>');
            modalBtnsEl.innerHTML = '';

            const input = document.createElement('input');
            input.type = "password"; // 비밀번호 입력용으로 설정
            if(placeholder === "방 코드 입력") input.type = "text";
            input.placeholder = placeholder;
            input.className = "w-full p-3 border-2 border-gray-300 rounded-xl mb-4 text-center font-bold text-xl";
            // 삽입 위치 조정
            modalMsgEl.parentNode.insertBefore(input, modalBtnsEl);

            const btnNo = document.createElement('button');
            btnNo.className = "bg-gray-400 text-white px-6 py-2 rounded-xl font-bold hover:bg-gray-500 shadow-[0_3px_0_#4b5563] active:translate-y-1 active:shadow-none";
            btnNo.innerText = "취소";
            btnNo.onclick = () => {
                input.remove();
                modalEl.classList.add('hidden');
            };
            modalBtnsEl.appendChild(btnNo);

            const btnYes = document.createElement('button');
            btnYes.className = "bg-blue-500 text-white px-6 py-2 rounded-xl font-bold hover:bg-blue-600 shadow-[0_3px_0_#1d4ed8] active:translate-y-1 active:shadow-none";
            btnYes.innerText = "확인";
            btnYes.onclick = () => {
                const val = input.value.trim();
                input.remove();
                modalEl.classList.add('hidden');
                onSubmit(val);
            };
            modalBtnsEl.appendChild(btnYes);

            modalEl.classList.remove('hidden');
            input.focus();
        }


        // ==================== 초기화 및 유틸리티 ====================
        const screenLobby = document.getElementById('screen-lobby');
        const screenGame = document.getElementById('screen-game');
        const screenAdmin = document.getElementById('screen-admin');
        const inputGrade = document.getElementById('input-grade');
        const inputClass = document.getElementById('input-class');
        const inputNumber = document.getElementById('input-number');
        const inputName = document.getElementById('input-name');
        const chatContainer = document.getElementById('chat-container');
        const displayScore = document.getElementById('display-score');
        const displayTimer = document.getElementById('display-timer');
        const wordInput = document.getElementById('word-input');
        const feedbackMsg = document.getElementById('feedback-msg');

        function switchScreen(screen) {
            screenLobby.classList.add('hidden');
            screenGame.classList.add('hidden');
            screenAdmin.classList.add('hidden');
            screen.classList.remove('hidden');
        }

        function maskName(name) {
            if (!name) return "익명";
            if (name.length <= 1) return name;
            if (name.length === 2) return name[0] + 'O';
            return name[0] + 'O' + name.substring(2);
        }

        function formatUserInfo(info) {
            return `${info.grade}학년 ${info.classNo}반 ${info.number}번 ${maskName(info.name)}`;
        }

        function getFullUserInfo() {
            const g = inputGrade.value;
            const c = inputClass.value;
            const num = inputNumber.value;
            const name = inputName.value.trim();
            
            if(!g || !c || !num || !name) {
                showCustomAlert("학년, 반, 번호, 이름을 모두 입력해주세요!");
                return null;
            }
            return { grade: g, classNo: c, number: num, name: name };
        }

        // 1만개 단어 데이터 백그라운드 로딩
        async function loadFastDictionary() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/first20hours/google-10000-english/master/google-10000-english-no-swears.txt');
                const text = await res.text();
                const words = text.split('\n');
                words.forEach(w => {
                    const trimmed = w.trim().toLowerCase();
                    if(trimmed.length > 1) fastWordList.add(trimmed);
                });
                console.log(`Loaded ${fastWordList.size} fast words.`);
            } catch(e) {
                console.warn("Failed to load fast dictionary, relying on API.");
            }
        }

        // ==================== 인증 및 DB 초기화 ====================
        window.onload = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                currentUserId = auth.currentUser.uid;
                
                // 앱 실행 시 1만 단어 사전 로딩
                loadFastDictionary();

                // 명예의 전당 실시간 리스너 연결
                setupHallOfFameListener();
            } catch (error) {
                console.error("인증 에러:", error);
                showCustomAlert("서버 연결에 실패했습니다. (인증 오류)");
            }
        };

        function setupHallOfFameListener() {
            if(!currentUserId) return;
            const hofRef = collection(db, 'artifacts', appId, 'public', 'data', 'hall_of_fame');
            onSnapshot(hofRef, (snapshot) => {
                let records = [];
                snapshot.forEach(doc => {
                    records.push({ id: doc.id, ...doc.data() });
                });
                // 점수 내림차순 정렬
                records.sort((a, b) => b.score - a.score);
                renderHallOfFame(records);
                renderAdminHallOfFame(records);
            }, (error) => {
                console.error("HoF Fetch Error", error);
            });
        }

        function renderHallOfFame(records) {
            const listEl = document.getElementById('hof-list');
            listEl.innerHTML = '';
            if (records.length === 0) {
                listEl.innerHTML = '<p class="text-center text-gray-400 mt-4">아직 기록이 없습니다. 첫 기록의 주인공이 되세요!</p>';
                return;
            }

            records.slice(0, 30).forEach((rec, idx) => {
                const el = document.createElement('div');
                const isMe = rec.userId === currentUserId;
                const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `<span class="w-6 inline-block text-center text-gray-500">${idx+1}</span>`;
                const modeBadge = rec.mode === 'multi' ? '<span class="text-[10px] bg-purple-200 text-purple-700 px-1 rounded ml-1">[멀티]</span>' : '<span class="text-[10px] bg-blue-200 text-blue-700 px-1 rounded ml-1">[혼자]</span>';
                
                el.className = `flex justify-between items-center p-3 rounded-xl border ${isMe ? 'bg-yellow-100 border-yellow-300 shadow-sm' : 'bg-white border-orange-100'} transition`;
                el.innerHTML = `
                    <div class="flex items-center">
                        <span class="mr-3 text-xl">${medal}</span>
                        <span class="font-bold text-gray-700">${rec.userInfo} ${modeBadge}</span>
                    </div>
                    <div class="font-bold text-orange-500 text-lg">${rec.score}점</div>
                `;
                listEl.appendChild(el);
            });
        }

        // ==================== 게임 코어 로직 ====================
        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 60;
            displayTimer.innerText = timeLeft;
            displayTimer.className = "font-bold text-2xl text-green-400"; // 초기 초록색

            timerInterval = setInterval(() => {
                timeLeft--;
                displayTimer.innerText = timeLeft;
                if(timeLeft <= 10) displayTimer.className = "font-bold text-3xl text-red-500 animate-pulse";
                else if(timeLeft <= 30) displayTimer.className = "font-bold text-2xl text-yellow-400";

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function handleTimeOut() {
            if (currentMode === 'single') {
                if (currentTurnPlayer === 'user') {
                    showCustomAlert(`시간 초과! 컴퓨터의 승리입니다.\n최종 점수: ${gameScore}점`, () => {
                        saveScoreToHoF();
                        exitGame();
                    });
                } else {
                    showCustomAlert(`컴퓨터가 시간 내에 단어를 찾지 못했습니다!\n사용자 승리!\n최종 점수: ${gameScore}점`, () => {
                        saveScoreToHoF();
                        exitGame();
                    });
                }
            } else if (currentMode === 'multi') {
                if (currentTurnPlayer === currentUserId) {
                    updateRoomState(currentRoomId, { status: "gameover", winner: "opponent", reason: "시간 초과" });
                }
            }
        }

        function addChatBubble(word, meaning, senderId, messageId = null) {
            // 사용자 요구사항 명확히 적용: 내가 한 것은 왼쪽, 상대/컴퓨터는 오른쪽
            const isMe = (senderId === currentUserId || senderId === 'user');
            
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${isMe ? 'justify-start' : 'justify-end'} mb-4`;
            if (messageId) wrapper.id = `msg-${messageId}`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[75%] px-5 py-3 rounded-2xl shadow-md pop-in relative flex flex-col items-center
                ${isMe ? 'bg-white rounded-tl-none border border-gray-200' : 'bg-yellow-300 rounded-tr-none border border-yellow-400'}`;
            
            const wordSpan = document.createElement('span');
            wordSpan.className = "text-2xl font-bold uppercase tracking-wider text-gray-800";
            wordSpan.innerText = word;
            
            const meaningSpan = document.createElement('span');
            meaningSpan.className = "meaning-text text-sm mt-1 text-gray-500 font-bold bg-white/50 px-2 rounded-full";
            meaningSpan.innerText = meaning;

            bubble.appendChild(wordSpan);
            bubble.appendChild(meaningSpan);
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function updateMeaningInUI(messageId, meaning) {
            const wrapper = document.getElementById(`msg-${messageId}`);
            if (wrapper) {
                const meaningSpan = wrapper.querySelector('.meaning-text');
                if (meaningSpan) meaningSpan.innerText = meaning;
            }
        }

        // ==================== 사전 검증 로직 ====================
        async function fetchMeaningFromAPI(word) {
            try {
                // MyMemory 번역 API 사용
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${word}&langpair=en|ko`);
                const data = await res.json();
                let meaning = data.responseData.translatedText;
                
                // 번역 실패하거나 그대로 영어로 반환되는 경우
                if (!meaning || meaning.toLowerCase() === word.toLowerCase() || meaning.includes("MYMEMORY")) {
                    return "알려진 영단어";
                }
                return meaning;
            } catch(e) {
                return "알려진 영단어";
            }
        }

        async function verifyWord(word) {
            word = word.toLowerCase();
            
            // 1. 끝말잇기 규칙 확인
            if (lastLetter && word[0] !== lastLetter) {
                return { valid: false, msg: `'${lastLetter.toUpperCase()}'(으)로 시작하는 단어를 입력하세요.` };
            }
            
            // 2. 중복 단어 확인
            if (usedWords.some(w => w.word === word)) {
                return { valid: false, msg: "이미 사용된 단어입니다." };
            }

            // 3. 내장 사전 우선 확인 (한글 뜻 보유)
            if (builtInDict[word]) {
                return { valid: true, meaning: builtInDict[word] };
            }

            // 4. 빠른 1만개 단어 리스트 확인 (0초 통과)
            if (fastWordList.has(word)) {
                return { valid: true, meaning: "뜻 검색 중... 🔍", needsBackgroundFetch: true };
            }

            // 5. 파이어베이스 글로벌 사전에 있는지 확인
            try {
                if(currentUserId) { // auth guard
                    const dictRef = doc(db, 'artifacts', appId, 'public', 'data', 'global_dictionary', word);
                    const dictSnap = await getDoc(dictRef);
                    if (dictSnap.exists()) {
                        return { valid: true, meaning: dictSnap.data().meaning };
                    }
                }
            } catch(e) { console.error(e); }

            // 6. 아무데도 없으면 최후의 수단: Free Dictionary API로 실존 여부 확인
            try {
                const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                if (res.ok) {
                    return { valid: true, meaning: "뜻 검색 중... 🔍", needsBackgroundFetch: true };
                }
            } catch(e) { }

            return { valid: false, msg: "사전에 없는 단어입니다." };
        }

        async function processValidWord(word, meaning, isBackgroundFetch, senderId) {
            const messageId = Date.now().toString() + Math.floor(Math.random()*1000);
            usedWords.push({ word: word, meaning: meaning });
            lastLetter = word[word.length - 1];
            
            if (senderId === currentUserId || senderId === 'user') {
                gameScore += 10;
                displayScore.innerText = gameScore;
                wordInput.value = '';
            }

            addChatBubble(word, meaning, senderId, messageId);

            // 백그라운드 뜻 가져오기 및 DB 저장
            if (isBackgroundFetch) {
                fetchMeaningFromAPI(word).then(async (realMeaning) => {
                    updateMeaningInUI(messageId, realMeaning);
                    
                    // 글로벌 사전에 저장하여 다음부터는 검색 없이 통과되게 함
                    if (currentUserId) {
                        try {
                            const dictRef = doc(db, 'artifacts', appId, 'public', 'data', 'global_dictionary', word);
                            await setDoc(dictRef, { meaning: realMeaning });
                        } catch(e) { console.error(e); }
                    }
                    
                    // 사용된 단어 배열 정보도 업데이트
                    const wordObj = usedWords.find(w => w.word === word);
                    if(wordObj) wordObj.meaning = realMeaning;
                    fastWordList.add(word); // 내 기기 임시 캐시에도 추가
                });
            }

            startTimer();
        }

        // ==================== 입력 처리 ====================
        wordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleInput();
        });
        document.getElementById('btn-submit').addEventListener('click', handleInput);

        async function handleInput() {
            if (isProcessing) return;
            const word = wordInput.value.trim().toLowerCase();
            
            if (!word) return;
            if (currentMode === 'single' && currentTurnPlayer !== 'user') return;
            if (currentMode === 'multi' && currentTurnPlayer !== currentUserId) {
                feedbackMsg.innerText = "상대방의 턴입니다. 기다려주세요.";
                return;
            }
            if (!/^[a-z]+$/.test(word)) {
                feedbackMsg.innerText = "영어 알파벳만 입력 가능합니다.";
                return;
            }

            setLoading(true);
            feedbackMsg.innerText = "";
            
            const result = await verifyWord(word);
            
            if (result.valid) {
                await processValidWord(word, result.meaning, result.needsBackgroundFetch, currentMode === 'single' ? 'user' : currentUserId);
                
                if (currentMode === 'single') {
                    currentTurnPlayer = 'computer';
                    document.getElementById('game-info').innerHTML = `<i class="fa-solid fa-desktop"></i> 컴퓨터가 생각 중...`;
                    setTimeout(playComputerTurn, 700); // 0.7초 후 컴퓨터 응답
                } else if (currentMode === 'multi') {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
                    const roomSnap = await getDoc(roomRef);
                    if (roomSnap.exists()) {
                        const roomData = roomSnap.data();
                        const opponentId = roomData.players.find(p => p.id !== currentUserId).id;
                        
                        await updateDoc(roomRef, {
                            lastWord: word,
                            usedWords: usedWords,
                            currentTurn: opponentId,
                            lastMeaning: result.meaning,
                            needsFetch: result.needsBackgroundFetch || false
                        });
                    }
                }
            } else {
                feedbackMsg.innerText = result.msg;
                wordInput.classList.add('border-red-500', 'animate-shake');
                setTimeout(() => wordInput.classList.remove('border-red-500', 'animate-shake'), 500);
            }
            
            setLoading(false);
            wordInput.focus();
        }

        function setLoading(isLoading) {
            isProcessing = isLoading;
            const icon = document.getElementById('btn-submit-icon');
            const spinner = document.getElementById('btn-submit-spinner');
            if (isLoading) {
                icon.classList.add('hidden');
                spinner.classList.remove('hidden');
                wordInput.disabled = true;
            } else {
                icon.classList.remove('hidden');
                spinner.classList.add('hidden');
                wordInput.disabled = false;
            }
        }

        // ==================== 혼자 하기 로직 ====================
        async function playComputerTurn() {
            // 빠른 단어 + 내장 단어 목록에서 필터링
            let candidates = Array.from(fastWordList).filter(w => w.startsWith(lastLetter) && !usedWords.some(uw => uw.word === w));
            
            if (candidates.length === 0) {
                showCustomAlert(`앗! 컴퓨터가 '${lastLetter.toUpperCase()}'(으)로 시작하는 단어를 모르겠대요.\n사용자 승리!\n최종 점수: ${gameScore}점`, () => {
                    saveScoreToHoF();
                    exitGame();
                });
                return;
            }

            // 랜덤 선택
            const pickedWord = candidates[Math.floor(Math.random() * candidates.length)];
            
            // 뜻 확인 (내장 사전에 없으면 API 번역 예약)
            let meaning = builtInDict[pickedWord];
            let needsFetch = false;
            if (!meaning) {
                meaning = "뜻 검색 중... 🔍";
                needsFetch = true;
            }

            await processValidWord(pickedWord, meaning, needsFetch, 'computer');
            
            currentTurnPlayer = 'user';
            document.getElementById('game-info').innerHTML = `<i class="fa-solid fa-user"></i> 내 차례!`;
        }

        // ==================== 멀티플레이 로직 ====================
        async function createRoom() {
            if(!currentUserId) return showCustomAlert("서버 연결 중입니다. 잠시 후 다시 시도해주세요.");
            
            // 4자리 방 코드 생성
            const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            currentRoomId = roomCode;
            
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
            await setDoc(roomRef, {
                status: 'waiting',
                players: [{ id: currentUserId, name: userInfo.name }],
                currentTurn: currentUserId,
                usedWords: [],
                lastWord: '',
                lastMeaning: '',
                createdAt: Date.now()
            });

            initMultiGameUI(roomCode, "상대방을 기다리는 중...");
            listenRoom(roomCode);
        }

        async function joinRoom(roomCode) {
            if(!currentUserId) return;
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
            const roomSnap = await getDoc(roomRef);

            if (!roomSnap.exists()) {
                showCustomAlert("방을 찾을 수 없습니다. 코드를 확인해주세요.");
                return;
            }
            
            const roomData = roomSnap.data();
            if (roomData.status !== 'waiting') {
                showCustomAlert("이미 게임이 진행 중이거나 종료된 방입니다.");
                return;
            }

            const newPlayers = [...roomData.players, { id: currentUserId, name: userInfo.name }];
            await updateDoc(roomRef, {
                status: 'playing',
                players: newPlayers
            });

            currentRoomId = roomCode;
            initMultiGameUI(roomCode, "게임 시작! 방장이 먼저 시작합니다.");
            listenRoom(roomCode);
        }

        function initMultiGameUI(roomCode, startMsg) {
            currentMode = 'multi';
            gameScore = 0;
            usedWords = [];
            lastLetter = '';
            chatContainer.innerHTML = '';
            displayScore.innerText = "0";
            
            document.getElementById('game-info').innerHTML = `<i class="fa-solid fa-users"></i> 방 코드: <span class="text-white bg-purple-500 px-2 py-0.5 rounded ml-1">${roomCode}</span>`;
            
            const div = document.createElement('div');
            div.className = "text-center text-gray-600 bg-white/60 p-2 rounded-lg font-bold text-sm my-2 mx-auto w-fit";
            div.innerText = startMsg;
            chatContainer.appendChild(div);

            switchScreen(screenGame);
            startTimer();
        }

        function listenRoom(roomCode) {
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
            roomUnsubscribe = onSnapshot(roomRef, async (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();

                if (data.status === 'playing') {
                    // 상대방이 들어왔을 때 알림 
                    if (data.players.length === 2 && usedWords.length === 0) {
                        const div = document.createElement('div');
                        div.className = "text-center text-blue-600 bg-blue-100 p-2 rounded-lg font-bold text-sm my-2 mx-auto w-fit";
                        div.innerText = "상대방이 입장했습니다! 게임을 시작합니다.";
                        chatContainer.appendChild(div);
                        startTimer();
                    }

                    // 단어가 업데이트 되었을 때
                    if (data.lastWord && data.usedWords.length > usedWords.length) {
                        const newWordObj = data.usedWords[data.usedWords.length - 1];
                        
                        // 내가 보낸 게 아닐 때만 화면에 그림
                        if (data.currentTurn === currentUserId) {
                             await processValidWord(newWordObj.word, data.lastMeaning, data.needsFetch, 'opponent');
                        } else {
                            // 내가 보낸 거면 이미 로컬에서 그렸으므로 동기화만 함
                            usedWords = data.usedWords;
                        }
                    }

                    currentTurnPlayer = data.currentTurn;
                    if (currentTurnPlayer === currentUserId) {
                        document.getElementById('game-info').innerHTML = `<i class="fa-solid fa-user text-blue-300"></i> 내 차례!`;
                        wordInput.placeholder = `'${lastLetter.toUpperCase()}'(으)로 시작하는 단어 입력`;
                        wordInput.disabled = false;
                        wordInput.focus();
                    } else {
                        document.getElementById('game-info').innerHTML = `<i class="fa-solid fa-hourglass-half text-yellow-300"></i> 상대방 차례...`;
                        wordInput.placeholder = "상대방이 입력 중입니다...";
                        wordInput.disabled = true;
                        feedbackMsg.innerText = "";
                    }
                } else if (data.status === 'gameover') {
                    clearInterval(timerInterval);
                    const isWinner = data.winner === 'opponent' ? data.currentTurn !== currentUserId : data.currentTurn === currentUserId; // 단순화
                    
                    let msg = `게임 종료! (${data.reason})\n\n`;
                    if (data.reason === '상대방 퇴장') {
                         msg += `상대방이 나갔습니다.\n최종 점수: ${gameScore}점`;
                    } else {
                        msg += isWinner ? `축하합니다! 승리하셨습니다!\n최종 점수: ${gameScore}점` : `아쉽게도 패배했습니다.\n최종 점수: ${gameScore}점`;
                    }

                    showCustomAlert(msg, () => {
                        saveScoreToHoF();
                        exitGame();
                    });
                }
            }, (error) => {
                console.error("Room listener error", error);
            });
        }

        async function updateRoomState(roomCode, updateData) {
             const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

            records.forEach(rec => {

            document.querySelectorAll('.btn-delete-rec').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    showCustomConfirm("정말로 이 기록을 삭제하시겠습니까?", async () => {
                        try {
                            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'hall_of_fame', id));
                            showCustomAlert("삭제 완료");
                        } catch(err) { console.error(err); }
                    });
                });
            });
        }
    </script>
</body>
